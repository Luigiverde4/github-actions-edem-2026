name: Ejercicio 3 - Matriz de Estrategia
on:
  workflow_dispatch:



jobs:
  Test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [3.11, 3.12, 3.14]
    steps:
      - name: Configurar Python ${{ matrix.version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.version }}
      - name: Mostrar versión de Python
        run: python --version