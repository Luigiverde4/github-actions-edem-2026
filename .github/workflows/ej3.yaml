name: Ejercicio 3 - Matriz de Estrategia
# Matriz de Estrategia: Ejecuta un mismo job de "Test" simultáneamente en tres versiones diferentes de Python (3.11 y 3.12).
on:
  workflow_dispatch:
    matrix:
      version: [3.9, 3.10, 3.11]


jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python ${{ matrix.version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.version }}
      - name: Mostrar versión de Python
        run: python --version