name: Ejercicio 4 - Artefactos de Construccion
#Artefactos de Construcción: Job 1 genera un archivo .txt con un mensaje. Job 2 debe descargar ese archivo y mostrar su contenido.

on:
  workflow_dispatch:
jobs:
  Job1:
    runs-on: ubuntu-latest
    steps:
      - name: Crear el archivo
        run: echo "Hola caracola" > archivo.txt
      - name: Ofrecer el archivo
        uses: actions/upload-artifact@v3
        with:
          name: archivo
  Job2:
    runs-on: ubuntu-latest
    needs: Job1
    steps:
      - name: Descargar el archivo
        uses: actions/download-artifact@v3
        with:
          name: archivo
      - name: Mostrar el contenido del archivo
        run: cat archivo.txt